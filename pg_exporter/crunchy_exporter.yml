ccp_postgresql_version:
  desc: "PostgreSQL version"
  query: | 
    SELECT current_setting('server_version_num')::int AS current;
  tags:
    - cluster
    - global
  ttl: 60
  fatal: true
  metrics:
    - current: 
        usage: "GAUGE"
        description: "The current version of PostgreSQL that this exporter is running on as a 6 digit integer (######)."

ccp_is_in_recovery:
  desc: "Recovery status"
  query: | 
   SELECT CASE WHEN pg_is_in_recovery = true THEN 1 ELSE 2 END AS status from pg_is_in_recovery(); 
  tags:
    - cluster
    - global
  ttl: 60
  metrics:
    - status:
        usage: "GAUGE"
        description: "Return value of 1 means database is in recovery. Otherwise 2 it is a primary."

ccp_database_size:
  desc: "Database size in bytes"
  query: | 
   SELECT datname as dbname, pg_database_size(datname) as bytes FROM pg_catalog.pg_database WHERE datistemplate = false 
  tags:
    - cluster
    - global
  ttl: 60
  metrics:
    - dbname:
        usage: "LABEL"
        description: "Database name"
    - bytes:
        usage: "GAUGE"
        description: "Database size in bytes"

ccp_locks:
  desc: "Database locks" 
  query: | 
    SELECT pg_database.datname as dbname, tmp.mode, COALESCE(count,0) as count
    FROM
      (
        VALUES ('accesssharelock'),
        ('rowsharelock'),
        ('rowexclusivelock'),
        ('shareupdateexclusivelock'),
        ('sharelock'),
        ('sharerowexclusivelock'),
        ('exclusivelock'),
        ('accessexclusivelock')
      ) AS tmp(mode) CROSS JOIN pg_catalog.pg_database
    LEFT JOIN
    (SELECT database, lower(mode) AS mode,count(*) AS count
      FROM pg_catalog.pg_locks WHERE database IS NOT NULL
      GROUP BY database, lower(mode)
    ) AS tmp2
    ON tmp.mode=tmp2.mode and pg_database.oid = tmp2.database;
  tags:
    - cluster
    - global
  ttl: 60
  metrics:
    - dbname:
        usage: "LABEL"
        description: "Database name"
    - mode:
        usage: "LABEL"
        description: "Lock type"
    - count:
        usage: "GAUGE"
        description: "Number of locks"


ccp_stat_bgwriter:
  desc: "Background Writer Metrics" 
  query: | 
    SELECT checkpoints_timed, checkpoints_req, checkpoint_write_time, checkpoint_sync_time, buffers_checkpoint, buffers_clean
    , maxwritten_clean, buffers_backend, buffers_backend_fsync, buffers_alloc, stats_reset 
    FROM pg_catalog.pg_stat_bgwriter;
  tags:
    - cluster
    - global
  ttl: 60
  metrics:
    - checkpoints_timed:
          usage: "GAUGE"
          description: "Number of scheduled checkpoints that have been performed"
    - checkpoints_req:
          usage: "GAUGE"
          description: "Number of requested checkpoints that have been performed"
    - checkpoint_write_time:
          usage: "GAUGE"
          description: "Total amount of time that has been spent in the portion of checkpoint processing where files are written to disk, in milliseconds"
    - checkpoint_sync_time:
          usage: "GAUGE"
          description: "Total amount of time that has been spent in the portion of checkpoint processing where files are synchronized to disk, in milliseconds"
    - buffers_checkpoint:
          usage: "GAUGE"
          description: "Number of buffers written during checkpoints"
    - buffers_clean:
          usage: "GAUGE"
          description: "Number of buffers written by the background writer"
    - maxwritten_clean:
          usage: "GAUGE"
          description: "Number of times the background writer stopped a cleaning scan because it had written too many buffers"
    - buffers_backend:
          usage: "GAUGE"
          description: "Number of buffers written directly by a backend"
    - buffers_backend_fsync:
          usage: "GAUGE"
          description: "Number of times a backend had to execute its own fsync call (normally the background writer handles those even when the backend does its own write)"
    - buffers_alloc:
          usage: "GAUGE"
          description: "Number of buffers allocated"
    - stats_reset:
          usage: "GAUGE"
          description: "Time at which these statistics were last reset"


ccp_stat_database:
  desc: "Database level statistics"
  query: | 
    SELECT s.datname as dbname, xact_commit, xact_rollback, blks_read, blks_hit, tup_returned, tup_fetched
    , tup_inserted, tup_updated, tup_deleted, conflicts, temp_files, temp_bytes, deadlocks 
    FROM pg_catalog.pg_stat_database s 
    JOIN pg_catalog.pg_database d on d.datname = s.datname 
    WHERE d.datistemplate = false;
  tags:
    - cluster
    - global
  ttl: 60
  metrics:
    - dbname:
        usage: "LABEL"
        description: "Name of database"
    - xact_commit: 
        usage: "GAUGE"
        description: "Number of transactions in this database that have been committed"
    - xact_rollback: 
        usage: "GAUGE"
        description: "Number of transactions in this database that have been rolled back"
    - blks_read:
        usage: "GAUGE"
        description: "Number of disk blocks read in this database"
    - blks_hit:
        usage: "GAUGE"
        description: "Number of times disk blocks were found already in the buffer cache, so that a read was not necessary"
    - tup_returned:
        usage: "GAUGE"
        description: "Number of rows returned by queries in this database"
    - tup_fetched:
        usage: "GAUGE"
        description: "Number of rows fetched by queries in this database"
    - tup_inserted:
        usage: "GAUGE"
        description: "Number of rows inserted by queries in this database"
    - tup_updated:
        usage: "GAUGE"
        description: "Number of rows updated by queries in this database"
    - tup_deleted:
        usage: "GAUGE"
        description: "Number of rows deleted by queries in this database"
    - conflicts:
        usage: "GAUGE"
        description: "Number of queries canceled due to conflicts with recovery in this database"
    - temp_files:
        usage: "GAUGE"
        description: "Number of rows deleted by queries in this database"
    - temp_bytes:
        usage: "GAUGE"
        description: "Total amount of data written to temporary files by queries in this database"
    - deadlocks:
        usage: "GAUGE"
        description: "Number of deadlocks detected in this database"


ccp_transaction_wraparound:
  desc: "Transaction ID Exhaustion/Wraparound metrics"
  query: | 
   WITH max_age AS ( SELECT 2000000000 as max_old_xid, setting AS autovacuum_freeze_max_age FROM pg_catalog.pg_settings WHERE name = 'autovacuum_freeze_max_age'), per_database_stats AS ( SELECT datname , m.max_old_xid::int , m.autovacuum_freeze_max_age::int , age(d.datfrozenxid) AS oldest_current_xid FROM pg_catalog.pg_database d JOIN max_age m ON (true) WHERE d.datallowconn) SELECT max(oldest_current_xid) AS oldest_current_xid , max(ROUND(100*(oldest_current_xid/max_old_xid::float))) AS percent_towards_wraparound , max(ROUND(100*(oldest_current_xid/autovacuum_freeze_max_age::float))) AS percent_towards_emergency_autovac FROM per_database_stats; 
  tags:
    - cluster
    - global
  ttl: 60
  metrics:
    - oldest_current_xid:
        usage: "GAUGE"
        description: "Oldest current transaction ID in cluster"
    - percent_towards_wraparound:
        usage: "GAUGE"
        description: "Percentage towards transaction ID wraparound"
    - percent_towards_emergency_autovac:
        usage: "GAUGE"
        description: "Percentage towards emergency autovacuum process starting"


ccp_archive_command_status:
  desc: "Archive command status"
  query: | 
    SELECT CASE 
        WHEN EXTRACT(epoch from (last_failed_time - last_archived_time)) IS NULL THEN 0
        WHEN EXTRACT(epoch from (last_failed_time - last_archived_time)) < 0 THEN 0
        ELSE EXTRACT(epoch from (last_failed_time - last_archived_time)) 
        END AS seconds_since_last_fail
    , EXTRACT(epoch from (CURRENT_TIMESTAMP - last_archived_time)) AS seconds_since_last_archive
    , archived_count
    , failed_count
    FROM pg_catalog.pg_stat_archiver 
  tags:
    - cluster
    - global
  ttl: 60
  metrics:
    - seconds_since_last_fail:
        usage: "GAUGE"
        description: "Seconds since the last recorded failure of the archive_command"
    - seconds_since_last_archive:
        usage: "GAUGE"
        description: "Seconds since the last successful archive operation"
    - archived_count:
        usage: "GAUGE"
        description: "Number of WAL files that have been successfully archived"
    - failed_count:
        usage: "GAUGE"
        description: "Number of failed attempts for archiving WAL files"

ccp_sequence_exhaustion:
  desc: "Sequence exhaustion status"
  query: | 
    SELECT count FROM monitor.sequence_exhaustion(75) 
  tags:
    - cluster
    - global
  ttl: 60
  metrics:
    - count:
        usage: "GAUGE"
        description: "Count of sequences that have reached greater than or equal to 75% of their max available numbers. Function monitor.sequence_status() can provide more details if run directly on system."

ccp_postmaster_uptime:
  desc: "Database uptime"
  query: | 
    SELECT extract(epoch from (clock_timestamp() - pg_postmaster_start_time() )) AS seconds; 
  tags:
    - cluster
    - global
  ttl: 60
  metrics:
    - seconds:
        usage: "GAUGE"
        description: "Time interval in seconds since PostgreSQL database was last restarted"

ccp_pg_settings_checksum:
  desc: "PostgreSQL Settings Checksum"
  query: | 
    SELECT monitor.pg_settings_checksum() AS status; 
  tags:
    - cluster
    - global
  ttl: 60
  metrics:
    - status:
        usage: "GAUGE"
        description: "Value of checksum monitioring status for pg_catalog.pg_settings (postgresql.conf). 0 = valid config. 1 = settings changed. To reset current config to valid after alert, run monitor.pg_settings_checksum_set_valid()."

ccp_settings_pending_restart:
  desc: "PostgreSQL Pending Restart Check"
  query: | 
    SELECT count(*) AS count FROM pg_catalog.pg_settings WHERE pending_restart = true 
  tags:
    - cluster
    - global
  ttl: 60
  metrics:
    - count:
        usage: "GAUGE"
        description: "Number of settings from pg_settings catalog in a pending_restart state"

##
#
# End : Global Queries
