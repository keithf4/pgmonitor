ccp_pg_stat_statements_total_pg10:
  name: ccp_pg_stat_statements_total
  desc: "pg_stat_statements total stats"
  query: | 
    SELECT pg_get_userbyid(s.userid) as role,
              d.datname AS dbname,
              sum(s.calls) AS calls_count,
              sum(s.total_time) AS exec_time_ms,
              avg(s.mean_time) AS mean_exec_time_ms,
              sum(s.rows) AS row_count
          FROM public.pg_stat_statements s
          JOIN pg_catalog.pg_database d
          ON d.oid = s.dbid
          GROUP BY 1,2;
