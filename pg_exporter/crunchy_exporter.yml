# Notes:
#
# - Auto-discovery works. With --include-database option, can dynamically add user tables to other databases to scrape
# - Adding custom tags (like "perdb") means those queries will not automatically be included to scrape (even if cluster/replica are also tags). Must use --tag flag to enable them. Having no tags means that metric will always be included
# - Removed pg_stat_statements limits macro and time macro for reset function argument
# - pgBackRest macro removed and shouldn't be needed anymore
# - name: field only needs to be set so far when query needs to be adjusted per version of PG but the metric name needs to stay the same. The collection name is what must remain unique
#
