#### Minimum PG 13

ccp_pg_stat_statements_total_pg13:
  name: ccp_pg_stat_statements_total
  desc: "pg_stat_statements total stats"
  query: | 
    SELECT pg_get_userbyid(s.userid) as role,
              d.datname AS dbname,
              sum(s.calls) AS calls_count,
              sum(s.total_exec_time) AS exec_time_ms,
              avg(s.mean_exec_time) AS mean_exec_time_ms,
              sum(s.rows) AS row_count
          FROM public.pg_stat_statements s
          JOIN pg_catalog.pg_database d
          ON d.oid = s.dbid
          GROUP BY 1,2 
  tags:
    - cluster
    - extension:pg_stat_statements
    - pg_stat_statements
  ttl: 60
  min_version: 130000
  max_version: 150000
  metrics:
    - role:
        usage: "LABEL"
        description: "Role that executed the statement"
    - dbname:
        usage: "LABEL"
        description: "Database in which the statement was executed"
    - calls_count:
        usage: "GAUGE"
        description: "Total number of queries run per user/database"
    - exec_time_ms:
        usage: "GAUGE"
        description: "Total runtime of all queries per user/database"
    - mean_exec_time_ms:
        usage: "GAUGE"
        description: "Mean runtime of all queries per user/database"
    - row_count:
        usage: "GAUGE"
        description: "Total rows returned from all queries per user/database"

ccp_pg_stat_statements_top_mean_pg13:
  name: ccp_pg_stat_statements_top_mean
  desc: "pg_stat_statements top mean queries"
  query: | 
    SELECT pg_get_userbyid(s.userid) as role,
              d.datname AS dbname,
              s.queryid,
              btrim(replace(left(s.query, 40), '\n', '')) AS query,
              max(s.mean_exec_time) exec_time_ms
          FROM public.pg_stat_statements s
          JOIN pg_catalog.pg_database d
          ON d.oid = s.dbid
          GROUP BY 1,2,3,4
          ORDER BY 5 DESC
          LIMIT 10;
  tags:
    - cluster
    - extension:pg_stat_statements
    - pg_stat_statements
  ttl: 60
  min_version: 130000
  max_version: 150000
  metrics:
    - role:
        usage: "LABEL"
        description: "Role that executed the statement"
    - dbname:
        usage: "LABEL"
        description: "Database in which the statement was executed"
    - queryid:
        usage: "LABEL"
        description: "Internal hash code, computed from the statement's parse tree"
    - query:
        usage: "LABEL"
        description: "First 40 characters of query text"
    - exec_time_ms:
        usage: "GAUGE"
        description: "Average query runtime in milliseconds"

ccp_pg_stat_statements_top_total_pg13:
  name: ccp_pg_stat_statements_top_total
  desc: "pg_stat_statements top total runtime queries"
  query: | 
    SELECT pg_get_userbyid(s.userid) as role,
              d.datname AS dbname,
              s.queryid,
              btrim(replace(left(s.query, 40), '\n', '')) AS query,
              s.total_exec_time exec_time_ms
          FROM public.pg_stat_statements s
          JOIN pg_catalog.pg_database d
          ON d.oid = s.dbid
          ORDER BY 5 DESC
          LIMIT 10;
  tags:
    - cluster
    - extension:pg_stat_statements
    - pg_stat_statements
  ttl: 60
  min_version: 130000
  max_version: 150000
  metrics:
    - role:
        usage: "LABEL"
        description: "Role that executed the statement"
    - dbname:
        usage: "LABEL"
        description: "Database in which the statement was executed"
    - queryid:
        usage: "LABEL"
        description: "Internal hash code, computed from the statement's parse tree"
    - query:
        usage: "LABEL"
        description: "First 40 characters of query text"
